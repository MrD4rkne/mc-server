# For QNAP Container Station: same as compose.yaml with absolute paths under /share/Container/minecraft
services:
  mc:
    image: itzg/minecraft-server:java25
    env_file: /share/Container/minecraft/.env
    environment:
      EULA: "TRUE"
      MOTD: "§c§ls§6§le§e§lr§a§lw§b§le§9§lr §d§l1c"
      TYPE: NEOFORGE
      VERSION: "26.3"
      # pinned below 26.3.0.37 (ModConfig.Type rename) until MixAuth > 1.3.3 is released
      NEOFORGE_VERSION: "26.3.0.36-beta"
      ONLINE_MODE: "FALSE"
      MEMORY: 16G
      ENABLE_WHITELIST: "TRUE"
      ENFORCE_WHITELIST: "TRUE"
      WHITELIST: |
        MrDarkne
      ONLINE_MOD: "FALSE"
      MODRINTH_PROJECTS: |
        chunky
        clumps
        alternate-current
        ferrite-core
        lithium
        servercore
        spark
        sound-physics-remastered
        simple-voice-chat
        mixauth
      MODRINTH_DOWNLOAD_DEPENDENCIES: required
      # Simple Voice Chat has only beta builds for 26.3
      MODRINTH_ALLOWED_VERSION_TYPE: beta
      RESOURCE_PACK: https://github.com/MrD4rkne/mc-server/releases/download/latest/resource_pack.zip
      RESOURCE_PACK_SHA1: 279f8b3d28e503b71d1f4c30ac9b7382368db2f4
      RESOURCE_PACK_ENFORCE: "TRUE"
    ports:
      - "25565:25565"
      - "24454:24454/udp"
    volumes:
      - /share/Container/minecraft/data:/data
      - /share/Container/minecraft/config:/config:ro
    restart: unless-stopped

  backups:
    image: itzg/mc-backup
    depends_on: [mc]
    env_file: /share/Container/minecraft/.env
    environment:
      RCON_HOST: mc
      BACKUP_INTERVAL: 4h
      INITIAL_DELAY: 5m
      PRUNE_BACKUPS_DAYS: 10
      PAUSE_IF_NO_PLAYERS: "true"
      TAR_COMPRESS_METHOD: zstd
    volumes:
      - /share/Container/minecraft/data:/data:ro
      - /share/Container/minecraft/backups:/backups
    restart: unless-stopped
